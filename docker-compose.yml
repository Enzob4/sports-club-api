services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sports_club
      POSTGRES_USER: symfony_user
      POSTGRES_PASSWORD: enzoenzo
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: sports_club_api
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://symfony_user:enzoenzo@database:5432/sports_club?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_SECRET: 67d829bf4a1656f4d048d88e02d68e53
      CORS_ALLOW_ORIGIN: '^https?://localhost(:[0-9]+)?$'
    depends_on:
      - database
  
  frontend:
    build: ../frontend
    container_name: sports_club_client
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend